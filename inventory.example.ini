# Copy this file to inventory.ini, fill it in and keep it private (it holds
# credentials). Every setting here overrides the defaults documented in
# ansible/roles/nai_poc/defaults/main.yml.

[nai_nodes]
# VM IPv4 address and the SSH account that has key-based login and
# passwordless sudo on the VM. ansible_host must be an IPv4 address.
nai ansible_host=192.0.2.10 ansible_user=nutanix
# The SSH key comes from your ssh-agent or ~/.ssh/id_*; set this otherwise:
# ansible_ssh_private_key_file=~/.ssh/id_ed25519

[nai_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

# --- Required: Docker Hub credentials authorized for the NAI images -------------
docker_username=YOUR_AUTHORIZED_ACCOUNT
docker_token=YOUR_DOCKER_TOKEN

# --- TLS (default: certificate from the NAI internal CA, access by IP) ----------
# The console is reached at https://<VM_IP>/; accept the browser warning.
tls_mode=selfsigned

# Optional: also put a DNS name in the certificate (resolve it to the VM IP
# yourself, e.g. in /etc/hosts). Leave commented to use the IP only.
# nai_fqdn=nai.lab.example.com

# Let's Encrypt: public DNS name and TCP 80/443 reachable from the Internet.
# tls_mode=letsencrypt
# nai_fqdn=nai.example.com
# admin_email=you@example.com

# Enterprise CA: PEM certificate (with intermediates) and unencrypted key,
# as absolute paths on the computer that runs Ansible.
# tls_mode=provided
# nai_fqdn=nai.example.com
# tls_cert_file=/absolute/path/fullchain.pem
# tls_key_file=/absolute/path/private-key.pem

# --- Optional S3 service (MinIO) for importing models from a bucket -------------
deploy_minio=true
minio_root_user=minioadmin
minio_root_password=minioadmin123

# --- Optional NAI image bundle already copied to the VM (else: registry pull) ---
bundle_path_on_host=/opt/nai/nai-v2.8.0.tar

