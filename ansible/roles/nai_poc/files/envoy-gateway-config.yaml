---
# Envoy Gateway configuration required by the NAI 2.8 guide ("Installing
# Prerequisite Components"): the AI Gateway controller in nai-system plugs
# into Envoy Gateway as an extension server, and the global rate limit uses
# the Valkey Sentinel deployed by nai-core.
config:
  envoyGateway:
    gateway:
      controllerName: "gateway.envoyproxy.io/gatewayclass-controller"
    logging:
      level:
        default: "info"
    provider:
      type: "Kubernetes"
      kubernetes:
        rateLimitDeployment:
          container:
            image: "docker.io/envoyproxy/ratelimit:1e50889b"
          patch:
            type: "StrategicMerge"
            value:
              spec:
                template:
                  spec:
                    containers:
                      - name: "envoy-ratelimit"
                        image: "docker.io/envoyproxy/ratelimit:1e50889b"
                        imagePullPolicy: "IfNotPresent"
                        env:
                          - name: REDIS_TYPE
                            value: "sentinel"
                          - name: REDIS_PIPELINE_WINDOW
                            value: "150us"
    extensionApis:
      enableEnvoyPatchPolicy: true
      enableBackend: true
    extensionManager:
      maxMessageSize: 11Mi
      backendResources:
        - group: inference.networking.k8s.io
          kind: InferencePool
          version: v1
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
            - "Translation"
            - "Cluster"
            - "Route"
      service:
        fqdn:
          hostname: "ai-gateway-controller.nai-system.svc.cluster.local"
          port: 1063
    rateLimit:
      backend:
        type: "Redis"
        redis:
          url: "mymaster,nai-valkey-sentinel.nai-system.svc.cluster.local:26379"
